name: goatbot-build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: yarn install --frozen-lockfile
      - run: yarn tauri build ${{ matrix.args }}
      - name: zip (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/GoatBot-0.1.0-mac-universal.dmg
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/GoatBot.app out/GoatBot-0.1.0-mac-universal.zip
      - name: zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/GoatBot-0.1.0-win-x64-setup.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName out/GoatBot-0.1.0-win-x64.msi
          Compress-Archive -Path src-tauri/target/release/goatbot.exe -DestinationPath out/GoatBot-0.1.0-win-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: goatbot-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  linux-qa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf xvfb imagemagick fonts-noto-cjk
      - run: yarn install --frozen-lockfile
      - run: yarn tauri build --bundles appimage
      - name: real message through the desktop app
        env:
          GOATBOT_QA_KEY: ${{ secrets.GOATBOT_QA_KEY }}
        run: |
          mkdir -p qa
          python3 - <<'PY'
          import os
          js = open("scripts/qa/send-message.js").read()
          js = js.replace("__GOATBOT_QA_KEY__", os.environ["GOATBOT_QA_KEY"]).replace("__GOATBOT_QA_MESSAGE__", "Hi! Introduce yourself in two short sentences.")
          open(os.path.expanduser("~/qa.js"), "w").write(js)
          PY
          python3 scripts/qa/result-server.py qa/result.json &
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          GOATBOT_QA_JS=$HOME/qa.js src-tauri/target/release/goatbot > qa/app.log 2>&1 &
          for i in $(seq 1 240); do [ -s qa/result.json ] && break; sleep 1; done
          sleep 2
          import -window root qa/goatbot-chat.png
          rm -f ~/qa.js
          cat qa/result.json
          python3 -c "import json,sys; r=json.load(open('qa/result.json')); sys.exit(0 if r.get('ok') else 1)"
      - run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/GoatBot-0.1.0-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goatbot-linux-qa
          path: |
            qa/goatbot-chat.png
            qa/result.json
            qa/app.log
            out/*
